networks:
  services-net:
    name: "services-net"
    driver: "bridge" # Allows communication between containers on the same network

services:

  # -- JENKINS WITH BLUE OCEAN --
  jenkins-blueocean:

    container_name: "jenkins-blueocean"

    # Build using the project's Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    
    group_add:
      - "999" # Add Jenkins user to the Docker group (group ID 999) to allow Docker socket access
      - "0"   # Add Jenkins user to the root group to allow Docker socket access

    # Environment variables; the rest are defined in the Dockerfile
    environment:
      - TZ=Europe/Madrid # Set timezone for consistent SonarQube and Jenkins logs
      - ATLASSIAN_MCP_URL=https://mcp.atlassian.com/v1/mcp

    networks:
      - "services-net"

    ports:
      - "50000:50000/tcp"
      - "8080:8080/tcp"

    restart: "on-failure"
    
    volumes:
      - "jenkins-data:/var/jenkins_home"
      - "/var/run/docker.sock:/var/run/docker.sock" # Allow Jenkins to control Docker on the host

  # -- SONARQUBE SERVER --
  sonarqube-server:

    container_name: "sonarqube-server"

    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

    image: "sonarqube:community"

    networks:
      - "services-net"

    ports:
      - "9000:9000/tcp"

    volumes:
      - "sonarqube_logs:/opt/sonarqube/logs"
      - "sonarqube_data:/opt/sonarqube/data"
      - "sonarqube_temp:/opt/sonarqube/temp"
      - "sonarqube_extensions:/opt/sonarqube/extensions"
  

  # -- PROMETHEUS, PUSHGATEWAY AND GRAFANA --
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    networks:
      - services-net
    ports:
      - "9090:9090"

  # Pushgateway to receive metrics from the agent and expose them to Prometheus
  pushgateway:
    image: prom/pushgateway:v1.11.2
    container_name: pushgateway
    command:
      - "--persistence.file=/data/metrics.data"
      - "--persistence.interval=1m"
    volumes:
      - ./pushgateway_data:/data
    networks:
      - services-net
    ports:
      - "9091:9091"

  # Grafana to visualize the metrics stored in Prometheus
  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - services-net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # Read-only MCP server used by GitHub Copilot to query CodeGuardian context
  codeguardian-mcp:
    container_name: codeguardian-mcp
    build:
      context: ..
      dockerfile: codeguardian-infra/Dockerfile.mcp
    networks:
      - services-net
    ports:
      - "8010:8010"
    volumes:
      - ..:/workspace
    environment:
      - CODEGUARDIAN_MCP_HOST=0.0.0.0
      - CODEGUARDIAN_MCP_PORT=8010
      - CODEGUARDIAN_MCP_PATH=/mcp
      - CODEGUARDIAN_WORKSPACE_ROOT=/workspace
      - BITBUCKET_WORKSPACE=${BITBUCKET_WORKSPACE:-}
      - ATLASSIAN_MCP_URL=https://mcp.atlassian.com/v1/mcp
      - ATLASSIAN_MCP_AUTH_HEADER=${ATLASSIAN_MCP_AUTH_HEADER:-}
      - BITBUCKET_URL=https://api.bitbucket.org/2.0
      - BITBUCKET_EMAIL=${BITBUCKET_EMAIL:-}
      - BITBUCKET_API_TOKEN=${BITBUCKET_API_TOKEN:-}
      - SONARQUBE_URL=http://sonarqube-server:9000
      - SONARQUBE_AUTH_TOKEN=${SONARQUBE_AUTH_TOKEN:-}
      - PROMETHEUS_URL=http://prometheus:9090
      - JENKINS_URL=http://jenkins-blueocean:8080
      - JENKINS_USER=${JENKINS_USER:-}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN:-}
    depends_on:
      - jenkins-blueocean
      - sonarqube-server
      - prometheus
    restart: "on-failure"

volumes:
  jenkins-data:
    external: true
    name: "infraestructura_jenkins-data"
  sonarqube_logs:
    external: true
    name: "infraestructura_sonarqube_logs"
  sonarqube_data:
    external: true
    name: "infraestructura_sonarqube_data"
  sonarqube_temp:
    external: true
    name: "infraestructura_sonarqube_temp"
  sonarqube_extensions:
    external: true
    name: "infraestructura_sonarqube_extensions"
